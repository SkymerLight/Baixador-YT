<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>YT Baixador</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="ytb-root">
    <header class="top">
      <div class="ytb-brand"><span class="ytb-logo" id="logo"></span>YT Baixador</div>
      <button id="toggle-settings" class="ytb-icon-btn" title="Configurações">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </header>

    <div id="update" class="update" hidden>
      <span id="update-text"></span>
      <button id="update-now" class="ytb-btn ytb-btn-primary small">Atualizar agora</button>
    </div>

    <div id="banner" class="banner" hidden></div>

    <section id="settings" class="settings" hidden>
      <label class="row">
        <span class="row-text"><b>Pasta de destino</b><small id="folder-path">Downloads</small></span>
        <button id="pick-folder" class="ytb-btn ytb-btn-ghost small">Escolher</button>
      </label>
      <label class="row check">
        <span class="row-text"><b>Priorizar H.264</b><small>Toca em qualquer player e celular. Desligue para pegar VP9/AV1.</small></span>
        <input type="checkbox" id="prefer-h264">
      </label>
      <label class="row check">
        <span class="row-text"><b>Notificar quando terminar</b></span>
        <input type="checkbox" id="notify">
      </label>
      <div class="row">
        <span class="row-text"><b>Motor de download</b><small id="engine">verificando…</small></span>
        <button id="update-engine" class="ytb-btn ytb-btn-ghost small">Atualizar</button>
      </div>
      <div class="row">
        <span class="row-text"><b>Extensão</b><small id="ext-version">verificando…</small></span>
        <button id="check-update" class="ytb-btn ytb-btn-ghost small">Procurar</button>
      </div>
    </section>

    <form id="url-form" class="url-form">
      <input id="url" type="url" placeholder="Cole o link do vídeo aqui" autocomplete="off" spellcheck="false">
      <button class="ytb-btn ytb-btn-ghost small" type="submit">Abrir</button>
    </form>

    <div id="panel"></div>

    <section id="history" class="history" hidden>
      <div class="history-head">
        <h2>Downloads</h2>
        <button id="clear" class="link">Limpar</button>
      </div>
      <div id="history-list" class="ytb-jobs"></div>
    </section>

    <footer class="credit">
      <button id="credit" class="credit-btn" title="Clique para copiar o Discord">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#5865F2" d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        <span id="credit-text">Criado por <b>Skymer#9220</b></span>
      </button>
      <a class="link" href="https://github.com/SkymerLight/Baixador-YT" target="_blank" rel="noopener">GitHub</a>
      <span id="version" class="version"></span>
    </footer>
  </div>
  <script src="../ui/panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
